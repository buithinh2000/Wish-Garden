name: Wish Garden PR checks
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check src/ceremony.js
          node --check src/sky-of-wishes.js
          node --check tests/browser-smoke.mjs
      - name: Run privacy and ceremony invariants
        run: node --test tests/*.test.mjs
