name: Deploy Wish Garden Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify preview artifact
        run: |
          test -s index.html
          ! grep -Eiq 'google-analytics|gtag\(|firebase|supabase' index.html
      - name: Run preview invariant tests
        run: node --test tests/*.test.mjs
      - name: Fetch licensed atmosphere artwork
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 'https://images.unsplash.com/photo-1726954531046-d033ef59ff0f?auto=format&fit=crop&w=1600&q=76' --output assets/forest.jpg
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 'https://images.unsplash.com/photo-1661777032455-5582bf3eba07?auto=format&fit=crop&w=1600&q=76' --output assets/cosmos.jpg
          test "$(wc -c < assets/forest.jpg)" -gt 15000
          test "$(wc -c < assets/cosmos.jpg)" -gt 15000
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.56.1 three@0.180.0 esbuild@0.25.12 @gltf-transform/cli@4.5.1
          npx playwright install chromium
      - name: Download licensed CC0 lotus sanctuary GLB
        run: |
          mkdir -p assets/sanctuary
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 'https://cdn.3dassets.dev/assets/36223/v1/model.glb' --output assets/sanctuary/lotus-pond-pavilion.glb
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path("assets/sanctuary/lotus-pond-pavilion.glb")
          b=p.read_bytes()
          assert 10000 < len(b) < 2500000, "Unexpected CC0 pavilion asset size"
          assert b[:4]==b"glTF", "Sanctuary asset must be binary glTF"
          assert struct.unpack_from("<I",b,8)[0]==len(b), "GLB internal length mismatch"
          print("CC0 lotus pavilion GLB verified:", len(b),"bytes")
          PY
      - name: Download CC0 detailed hero oak GLB
        run: |
          mkdir -p assets/nature
          curl --fail --location --retry 3 --retry-all-errors --connect-timeout 15 --max-time 120 'https://files.innerscene.com/library/oak-street-tree-detailed-leaves-a273fef9/4a26d0fea7474835bf61/oak-detailed.glb' --output assets/nature/wishing-oak-detailed.glb
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p=Path('assets/nature/wishing-oak-detailed.glb')
          b=p.read_bytes()
          assert 100000 < len(b) < 10000000, 'Unexpected oak GLB size'
          assert b[:4] == b'glTF', 'Oak asset is not a GLB'
          assert struct.unpack_from('<I',b,8)[0] == len(b), 'GLB payload incomplete'
          print('CC0 detailed oak GLB verified',len(b),'bytes')
          PY
      - name: Fetch pinned CC0 Kenney GLBs from public provenance mirror
        run: |
          mkdir -p assets/nature
          BASE='https://raw.githubusercontent.com/rajsinghtech/spurfire/8792fe1404eabd93ff12dd0726460da5db648b02/game/assets/kenney/nature-kit'
          for NAME in tree_default tree_oak rock_largeA; do
            curl --fail --location --retry 3 --connect-timeout 15 --max-time 40 "$BASE/$NAME.glb" --output "assets/nature/$NAME.glb"
          done
          echo '562d29638c902de3c7bee465d3a53bb77117efbc392ae04ed894faf6b5dc691d  assets/nature/tree_default.glb' | sha256sum -c -
          echo 'd7fd8773674928c50c11b66d12c636d49bdcc15a8b1c7fbb98e6f63a3439a3f3  assets/nature/tree_oak.glb' | sha256sum -c -
          echo '6dd15390fd96501dcd1454765a17ba61dbbd8d47705dfe5149c8dd92b353ce25  assets/nature/rock_largeA.glb' | sha256sum -c -
      - name: Build locally hosted 3D visitor
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 'https://gobkit.com/freebies/human003/Priestess.glb' --output assets/visitor-rig.glb
          test "$(wc -c < assets/visitor-rig.glb)" -gt 10000
          python3 scripts/clean_visitor_glb.py assets/visitor-rig.glb
          # CC0 MakeHuman-derived civilian character candidate, with casual clothes
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 120 'https://files.innerscene.com/library/locomotion-collection-maya-3d-person-animated-1499b2fd/565cfb8a45b8a67a79c4/locomotion-collection-maya-3d-person-animated.glb' --output assets/visitor-human.glb
          test "$(wc -c < assets/visitor-human.glb)" -gt 1000000
          # Reduce large PNG textures for smartphone-sized visitor canvas.
          npx gltf-transform resize assets/visitor-human.glb assets/visitor-human-resized.glb --width 1024 --height 1024
          npx gltf-transform webp assets/visitor-human-resized.glb assets/visitor-human-small.glb
          rm assets/visitor-human-resized.glb
          mv assets/visitor-human-small.glb assets/visitor-human.glb
          test "$(wc -c < assets/visitor-human.glb)" -lt 12000000
          npx esbuild src/visitor-rig.js --bundle --format=iife --target=es2020 --minify --outfile=assets/visitor-rig.bundle.js
          npx esbuild src/sanctuary-world.js --bundle --format=iife --target=es2020 --minify --outfile=assets/sanctuary-world.bundle.js
          test -s assets/visitor-rig.bundle.js
          test -s assets/sanctuary-world.bundle.js
      # Full desktop/mobile WebGL journeys are already required in PR checks.
      # Do not block publication on repeated GPU software-rendering screenshots.
      - name: Release gate - assets, bundles and tree availability
        run: |
          set -euo pipefail
          test -s assets/nature/wishing-oak-detailed.glb
          test -s assets/nature/tree_oak.glb
          test -s assets/visitor-human.glb
          test -s assets/sanctuary-world.bundle.js
          grep -Fq 'wishing-oak-detailed.glb' assets/sanctuary-world.bundle.js
          node --check assets/sanctuary-world.bundle.js
      - name: Stamp source commit into public world and bust cached 3D bundle
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${RELEASE_SHA:0:12}"
          sed -i "s/__WISH_BUILD_SHA__/${SHORT_SHA}/g" world.html
          grep -Fq "Build ${SHORT_SHA}" world.html
          grep -Fq "sanctuary-world.bundle.js?v=${SHORT_SHA}" world.html
          grep -Fq "src/world-ritual.css?v=${SHORT_SHA}" world.html
          grep -Fq "src/world-ritual.js?v=${SHORT_SHA}" world.html
          ! grep -Fq '__WISH_BUILD_SHA__' world.html
      - name: Exclude temporary npm dependencies from Pages artifact
        run: rm -rf node_modules
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy static preview
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public Pages release and 3D assets
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$PAGES_URL"
          SHORT_SHA="${RELEASE_SHA:0:12}"
          BASE="${PAGES_URL%/}"
          echo "Verify deployed site: $BASE/world.html"
          curl --fail --silent --show-error --location --retry 12 --retry-delay 5 --retry-all-errors --max-time 30 "$BASE/world.html" -o /tmp/live-wish-world.html
          grep -Fq "Build $SHORT_SHA" /tmp/live-wish-world.html
          grep -Fq "sanctuary-world.bundle.js?v=$SHORT_SHA" /tmp/live-wish-world.html
          grep -Fq "src/world-ritual.css?v=$SHORT_SHA" /tmp/live-wish-world.html
          grep -Fq "src/world-ritual.js?v=$SHORT_SHA" /tmp/live-wish-world.html
          grep -Fq 'id="daylightStatus"' /tmp/live-wish-world.html
          grep -Fq 'class="world-prayer-link"' /tmp/live-wish-world.html
          for FILE in assets/sanctuary-world.bundle.js assets/sanctuary/lotus-pond-pavilion.glb assets/nature/tree_oak.glb assets/nature/wishing-oak-detailed.glb assets/visitor-human.glb assets/daylight-clock.js src/world-ritual.css src/world-ritual.js; do
            curl --fail --silent --show-error --location --retry 5 --retry-delay 3 --retry-all-errors --max-time 30 "$BASE/$FILE" -o /tmp/wish-public-asset
            test -s /tmp/wish-public-asset
            echo "PUBLIC OK: $FILE"
          done
          echo "PUBLIC PAGES VERIFIED: Build $SHORT_SHA and 3D assets"
