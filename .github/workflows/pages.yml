name: Deploy Wish Garden Preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Verify preview artifact
        run: |
          test -s index.html
          ! grep -Eiq 'google-analytics|gtag\(|firebase|supabase' index.html
      - name: Run preview invariant tests
        run: node --test tests/*.test.mjs
      - name: Fetch licensed atmosphere artwork
        run: |
          mkdir -p assets
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 'https://images.unsplash.com/photo-1764798722469-a22f1752fc1c?auto=format&fit=crop&w=1600&q=76' --output assets/forest.jpg
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 90 'https://images.unsplash.com/photo-1661777032455-5582bf3eba07?auto=format&fit=crop&w=1600&q=76' --output assets/cosmos.jpg
          test "$(wc -c < assets/forest.jpg)" -gt 15000
          test "$(wc -c < assets/cosmos.jpg)" -gt 15000
      - name: Install browser test runner
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile Chromium smoke
        run: node tests/browser-smoke.mjs
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy static preview
        id: deployment
        uses: actions/deploy-pages@v4
