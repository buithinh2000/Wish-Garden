name: Wish Garden AWS OIDC preflight (no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  verify-identity:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: wish-garden-aws-staging
    steps:
      - name: Require dedicated Wish Garden role
        env:
          ROLE_ARN: ${{ vars.WISH_GARDEN_AWS_ROLE_ARN }}
        run: |
          test "$ROLE_ARN" = "arn:aws:iam::916004827349:role/WishGardenGitHubStagingDeployRole" || {
            echo "Not configured: Wish Garden dedicated OIDC role";
            exit 1;
          }
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.WISH_GARDEN_AWS_ROLE_ARN }}
          role-session-name: WishGardenOIDCPreflight
          aws-region: ap-southeast-1
      - name: Confirm exact account and temporary OIDC credentials
        run: |
          test "$(aws sts get-caller-identity --query Account --output text)" = "916004827349"
          test "$AWS_REGION" = "ap-southeast-1"
          aws sts get-caller-identity --query '{Account:Account,Arn:Arn}' --output json
      - name: No AWS resource mutation
        run: echo "OIDC identity verified. No CloudFormation, S3, CloudFront, Lambda or DynamoDB mutation attempted."
